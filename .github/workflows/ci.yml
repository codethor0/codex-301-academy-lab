name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, build, and Guides tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Start the production server
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > next-start.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/guides; then
              exit 0
            fi
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: Guides acceptance tests
        run: pnpm test:guides
        env:
          GUIDES_BASE_URL: http://127.0.0.1:3000
